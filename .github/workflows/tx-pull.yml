name: "Scheduled Transifex Update"

on:
  schedule:
    # every day at 8:15 PM UTC
    - cron: "15 20 * * *"
  workflow_dispatch:

jobs:
  pull-translations:
    if: github.repository_owner == 'openmrs'
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/tx-pull.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
      BOT_GH_TOKEN: ${{ secrets.OMRS_BOT_GH_TOKEN }}
