name: Report bundle size

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🚀 Setup Turborepo cache server
        # Actions-cache backed: entries written by a pull_request run are scoped to that
        # PR's merge ref, so a PR cannot plant an entry a build on main would restore.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: 📊 Compute bundle size report
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          minimum-change-threshold: 10000 # 10 KB
          build-script: "turbo run build --concurrency=5"
          clean-script: "clean:dist"
